version: '3.8'
services:
  app:
    build: .
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5000/health']
      interval: 30s
      timeout: 3s
      retries: 3
volumes:
  uploads:
